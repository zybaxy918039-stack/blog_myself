<body class="ai-art-page">
    <div class="backdrop-layer" aria-hidden="true"></div>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="index.html">
                <span class="brand-mark">书</span>
                <span class="brand-title">
                    <span data-site-title>雾中书桌</span>
                    <span class="brand-sub" data-site-subtitle>个人网络日志</span>

            <nav class="site-nav" aria-label="主导航">

                <a href="admin/index.html" class="nav-bubble">管理</a>
            </nav>
        </header>

        <main class="gallery-stage fade-in">
            <div class="page-head">
                <div>
                    <div class="eyebrow">AI 绘图</div>
                    <h1>AI 绘图</h1>
                </div>
                <p>把生成图像的实验整理成一个小画廊。</p>
            </div>

            <section class="photo-gallery" id="ai-art">
                <div class="gallery-title">
                    <span>作品墙</span>
                    <small>待整理</small>
                </div>

                <div class="photo-stack">
                    <figure class="photo-frame" style="--tilt: -7deg; --lift: -20px; --z: 1;">
                        <img src="assets/1.png" alt="AI 绘图作品">
                        <figcaption>
                            <span>雾中清晨</span>
                            <small>AI 绘图实验</small>
                        </figcaption>
                    </figure>
                    <figure class="photo-frame" style="--tilt: 4deg; --lift: 18px; --z: 2;">
                        <img src="assets/bg-mist-morning.jpg" alt="AI 绘图作品">
                        <figcaption>
                            <span>晨雾</span>
                            <small>AI 绘图实验</small>
                        </figcaption>
                    </figure>
                    <figure class="photo-frame" style="--tilt: -3deg; --lift: -8px; --z: 3;">
                        <img src="assets/bg-night-ink.jpg" alt="AI 绘图作品">
                        <figcaption>
                            <span>夜墨</span>
                            <small>AI 绘图实验</small>
                        </figcaption>
                    </figure>
                    <figure class="photo-frame" style="--tilt: 6deg; --lift: 26px; --z: 4;">
                        <img src="assets/bg-warm-desk.jpg" alt="AI 绘图作品">
                        <figcaption>
                            <span>暖桌</span>
                            <small>AI 绘图实验</small>
                        </figcaption>
                    </figure>
                    <a class="photo-frame photo-frame-add" href="admin/index.html" style="--tilt: -5deg; --lift: 4px; --z: 5;">
                        <span class="photo-add-mark">+</span>
                        <span>放入新作品</span>
                        <small>前往管理后台</small>
                    </a>
                </div>
            </section>

            <footer class="site-footer">
                <p>&copy; 2026 雾中书桌</p>
            </footer>
