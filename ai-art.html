<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 绘图 - 雾中书桌</title>
    <meta name="description" content="AI 绘图作品和实验">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ai-art-page">
    <div class="backdrop-layer" aria-hidden="true"></div>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="index.html">
                <span class="brand-mark">书</span>
                <span class="brand-title">
                    <span data-site-title>雾中书桌</span>
                    <span class="brand-sub" data-site-subtitle>个人网络日志</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="主导航">
                <a href="index.html" class="nav-bubble">首页</a>
                <a href="essays.html" class="nav-bubble">随笔</a>
                <a href="fiction.html" class="nav-bubble">小说</a>
                <a href="tech.html" class="nav-bubble">技术</a>
                <a href="ai-art.html" class="nav-bubble active">AI 绘图</a>
                <a href="about.html" class="nav-bubble">关于</a>
                <a href="admin/index.html" class="nav-bubble">管理</a>
            </nav>
        </header>

        <main class="gallery-stage fade-in">
            <div class="page-head">
                <div>
                    <div class="eyebrow">AI 绘图</div>
                    <h1>AI 绘图</h1>
                </div>
                <p>把生成图像的实验整理成一个小画廊。</p>
            </div>

            <section class="photo-gallery" id="ai-art">
                <div class="gallery-title">
                    <span>作品墙</span>
                    <small>待整理</small>
                </div>

                <div class="gallery-board-grid">
                    <article class="gallery-board">
                        <div class="gallery-board-head">
                            <h2>晨雾系列</h2>
                            <span>3 张</span>
                        </div>
                        <div class="pinned-stack">
                            <figure class="pinned-photo" style="--r: -7deg; --x: -22px; --y: 10px; --z: 1;">
                                <img src="assets/1.png" alt="晨雾系列作品">
                                <span class="pin"></span>
                                <figcaption>雾中清晨</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: 4deg; --x: 20px; --y: -8px; --z: 2;">
                                <img src="assets/bg-mist-morning.jpg" alt="晨雾系列作品">
                                <span class="pin"></span>
                                <figcaption>晨雾</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: -2deg; --x: 0; --y: 18px; --z: 3;">
                                <img src="assets/bg-night-ink.jpg" alt="晨雾系列作品">
                                <span class="pin"></span>
                                <figcaption>雾后夜色</figcaption>
                            </figure>
                        </div>
                    </article>

                    <article class="gallery-board">
                        <div class="gallery-board-head">
                            <h2>夜墨系列</h2>
                            <span>3 张</span>
                        </div>
                        <div class="pinned-stack">
                            <figure class="pinned-photo" style="--r: 6deg; --x: 18px; --y: -12px; --z: 1;">
                                <img src="assets/bg-night-ink.jpg" alt="夜墨系列作品">
                                <span class="pin"></span>
                                <figcaption>夜墨</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: -5deg; --x: -20px; --y: 6px; --z: 2;">
                                <img src="assets/1.png" alt="夜墨系列作品">
                                <span class="pin"></span>
                                <figcaption>冷光</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: 1deg; --x: 0; --y: -18px; --z: 3;">
                                <img src="assets/bg-warm-desk.jpg" alt="夜墨系列作品">
                                <span class="pin"></span>
                                <figcaption>案头余温</figcaption>
                            </figure>
                        </div>
                    </article>

                    <article class="gallery-board">
                        <div class="gallery-board-head">
                            <h2>暖桌系列</h2>
                            <span>3 张</span>
                        </div>
                        <div class="pinned-stack">
                            <figure class="pinned-photo" style="--r: -8deg; --x: -24px; --y: -6px; --z: 1;">
                                <img src="assets/bg-warm-desk.jpg" alt="暖桌系列作品">
                                <span class="pin"></span>
                                <figcaption>暖桌</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: 5deg; --x: 18px; --y: 12px; --z: 2;">
                                <img src="assets/bg-mist-morning.jpg" alt="暖桌系列作品">
                                <span class="pin"></span>
                                <figcaption>窗外晨光</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: -1deg; --x: 2px; --y: -16px; --z: 3;">
                                <img src="assets/1.png" alt="暖桌系列作品">
                                <span class="pin"></span>
                                <figcaption>静物</figcaption>
                            </figure>
                        </div>
                    </article>

                    <article class="gallery-board">
                        <div class="gallery-board-head">
                            <h2>幻想系列</h2>
                            <span>3 张</span>
                        </div>
                        <div class="pinned-stack">
                            <figure class="pinned-photo" style="--r: 7deg; --x: 24px; --y: 8px; --z: 1;">
                                <img src="assets/1.png" alt="幻想系列作品">
                                <span class="pin"></span>
                                <figcaption>雾中幻境</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: -6deg; --x: -18px; --y: -14px; --z: 2;">
                                <img src="assets/bg-night-ink.jpg" alt="幻想系列作品">
                                <span class="pin"></span>
                                <figcaption>夜航</figcaption>
                            </figure>
                            <figure class="pinned-photo" style="--r: 2deg; --x: 0; --y: 16px; --z: 3;">
                                <img src="assets/bg-mist-morning.jpg" alt="幻想系列作品">
                                <span class="pin"></span>
                                <figcaption>未知来信</figcaption>
                            </figure>
                        </div>
                    </article>

                    <a class="gallery-board gallery-board-add" href="admin/index.html">
                        <div class="pinned-stack add-stack">
                            <span class="photo-add-mark">+</span>
                            <span>放入新作品</span>
                            <small>前往管理后台</small>
                        </div>
                    </a>
                </div>
            </section>

            <footer class="site-footer">
                <p>&copy; 2026 雾中书桌</p>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
