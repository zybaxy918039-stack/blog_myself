<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=essays.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章墙 - 雾中书桌</title>
    <meta name="description" content="把每一篇文章挂在这里，按自己的节奏阅读。">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backdrop-layer" aria-hidden="true"></div>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="index.html">
                <span class="brand-mark">书</span>
                <span class="brand-title">
                    <span data-site-title>雾中书桌</span>
                    <span class="brand-sub" data-site-subtitle>个人网络日志</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="主导航">
                <a href="index.html" class="nav-bubble">首页</a>
                <a href="posts.html" class="nav-bubble active">文章</a>
                <a href="about.html" class="nav-bubble">关于</a>
                <a href="admin/index.html" class="nav-bubble">管理</a>
            </nav>
        </header>

        <main class="glass-panel fade-in">
            <div class="page-head">
                <div>
                    <div class="eyebrow">文章</div>
                    <h1>文章墙</h1>
                </div>
                <p>每一块相框里，都是一段留在纸上的时间。</p>
            </div>

            <section class="category-stack" aria-label="内容板块">
                <section class="category-board" id="essays">
                    <div class="board-head">
                        <div>
                            <div class="eyebrow">随笔</div>
                            <h2>随笔</h2>
                        </div>
                        <span class="board-count">1 篇</span>
                    </div>

                    <div class="posts-grid">
                    <article class="post-card" data-categories="随笔">
                        <a href="posts/post1.html" class="post-link">
                            <div class="post-badge">随笔</div>
                            <h3 class="post-title">欢迎来到我的博客</h3>
                            <p class="post-summary">这是我的第一个博客文章，介绍这个博客的用途和计划。</p>
                            <div class="post-meta">
                                <span class="post-date">2026-09-01</span>
                                <span class="post-tags">
                                    <span class="tag">随笔</span>
                                    <span class="tag">介绍</span>
                                </span>
                            </div>
                        </a>
                    </article>
                    </div>
                </section>

                <section class="category-board" id="fiction">
                    <div class="board-head">
                        <div>
                            <div class="eyebrow">小说</div>
                            <h2>小说</h2>
                        </div>
                        <span class="board-count">0 篇</span>
                    </div>
                    <div class="empty-board">小说草稿暂时还没有挂出来</div>
                </section>

                <section class="category-board" id="tech">
                    <div class="board-head">
                        <div>
                            <div class="eyebrow">技术</div>
                            <h2>技术</h2>
                        </div>
                        <span class="board-count">1 篇</span>
                    </div>

                    <div class="posts-grid">
                    <article class="post-card" data-categories="技术">
                        <a href="posts/post2.html" class="post-link">
                            <div class="post-badge">技术</div>
                            <h3 class="post-title">如何开始学习编程</h3>
                            <p class="post-summary">一篇介绍编程学习路径和技术入门的文章。</p>
                            <div class="post-meta">
                                <span class="post-date">2026-09-01</span>
                                <span class="post-tags">
                                    <span class="tag">编程</span>
                                    <span class="tag">入门</span>
                                </span>
                            </div>
                        </a>
                    </article>
                    </div>
                </section>

                <section class="ai-art-board" id="ai-art">
                    <div class="board-head">
                        <div>
                            <div class="eyebrow">AI 绘图</div>
                            <h2>AI 绘图</h2>
                        </div>
                        <span class="board-count">待整理</span>
                    </div>

                    <div class="ai-art-grid">
                        <div class="ai-art-card empty">
                            <span class="ai-art-symbol">AI</span>
                            <p>待放入作品</p>
                        </div>
                        <div class="ai-art-card empty">
                            <span class="ai-art-symbol">AI</span>
                            <p>待放入作品</p>
                        </div>
                        <a class="ai-art-card ai-art-add" href="admin/index.html">
                            <span class="plus-icon">+</span>
                            <p>管理绘图作品</p>
                        </a>
                    </div>
                </section>
            </section>

            <footer class="site-footer">
                <p>&copy; 2026 雾中书桌 - 用文字保留片段</p>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
