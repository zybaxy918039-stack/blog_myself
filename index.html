<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雾中书桌 - 个人网络日志</title>
    <meta name="description" content="一个混合型个人博客，包含技术文章、生活随笔和小说草稿">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backdrop-layer" aria-hidden="true"></div>
    <div class="page-shell">
        <aside class="sidebar">
            <a class="brand" href="index.html">
                <span class="brand-mark">书</span>
                <span class="brand-title">雾中书桌<span class="brand-sub">个人网络日志</span></span>
            </a>
            <nav class="bubble-nav" aria-label="主导航">
                <a href="index.html" class="nav-bubble active">首页</a>
                <a href="index.html#posts" class="nav-bubble">文章</a>
                <a href="about.html" class="nav-bubble">关于</a>
                <a href="admin/index.html" class="nav-bubble">管理</a>
            </nav>
            <div class="sidebar-foot">写作、技术、小说与生活随想。</div>
        </aside>
        <main class="glass-panel fade-in">
            <div class="page-head">
                <div>
                    <div class="eyebrow">网络日志</div>
                    <h1>雾中书桌</h1>
                </div>
                <p>把稍纵即逝的想法留在纸上，把可以继续生长的草稿留在身边。</p>
            </div>

            <section class="hero-section">
                <h2>欢迎来到我的网络日志</h2>
                <p>技术、随笔、小说草稿和项目记录都收在这里。最近的内容会出现在文章区，之后也可以按标签分类浏览。</p>
                <a href="#posts" class="btn btn-primary">开始浏览</a>
            </section>

            <section id="posts" class="posts-section">
                <div class="section-header">
                    <h2>最新文章</h2>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="随笔">随笔</button>
                        <button class="filter-btn" data-filter="技术">技术</button>
                        <button class="filter-btn" data-filter="小说">小说</button>
                    </div>
                </div>
                <div class="posts-grid">
                    <article class="post-card" data-categories="随笔">
                        <a href="posts/post1.html" class="post-link">
                            <div class="post-badge">随笔</div>
                            <h3 class="post-title">欢迎来到我的博客</h3>
                            <p class="post-summary">这是我的第一个博客文章，介绍这个博客的用途和计划。</p>
                            <div class="post-meta">
                                <span class="post-date">2026-09-01</span>
                                <span class="post-tags">
                                    <span class="tag">随笔</span>
                                    <span class="tag">介绍</span>
                                </span>
                            </div>
                        </a>
                    </article>
                    <article class="post-card" data-categories="技术">
                        <a href="posts/post2.html" class="post-link">
                            <div class="post-badge">技术</div>
                            <h3 class="post-title">如何开始学习编程</h3>
                            <p class="post-summary">一篇介绍编程学习路径和技术入门的文章。</p>
                            <div class="post-meta">
                                <span class="post-date">2026-09-01</span>
                                <span class="post-tags">
                                    <span class="tag">编程</span>
                                    <span class="tag">入门</span>
                                </span>
                            </div>
                        </a>
                    </article>
                </div>
            </section>

            <footer class="site-footer">
                <p>&copy; 2026 雾中书桌 - 用写作记录生活</p>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
